<div class="page">
    <div class="toolbar">
        <button class="btn" (click)="backToMovieList()">Back</button>
        <h2>My Wish List</h2>
        <span class="spacer"></span>
    </div>

    @if (movieService.wishList().length > 0) {
        <div class="grid">
            @for (movie of movieService.wishList(); track movie.id) {
                <div class="movie-card" (click)="openDetail(movie.id)">
                    <img [src]="`https://image.tmdb.org/t/p/w500${movie.poster_path}`" [alt]="movie.title" />
                    <div class="movie-details">
                        <h3>{{ movie.title }}</h3>
                    </div>
                </div>
            }
        </div>
    } @else {
        <p class="empty">Votre wish list est vide.</p>
    }
</div>
